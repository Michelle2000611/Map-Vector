[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "map-vector"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi==0.115.6", "pydantic==2.10.4", "uvicorn==0.34.0", "python-multipart==0.0.20", "pillow==10.1.0", "shapely==2.2.0", "numpy==1.26.4", "pandas==2.3.3", "geopandas==1.1.4", "pyogrio==0.13.0", "rasterio==1.4.4", "pypdfium2==4.30.0", "opencv-contrib-python-headless==4.10.0.84", "opencv-python==4.10.0.84", "scipy==1.15.3", "scikit-image==0.24.0", "scikit-learn==1.7.2", "onnxruntime==1.23.2", "rapidocr==3.4.5", "pyclipper==1.4.0", "omegaconf==2.4.0", "threadpoolctl==3.8.0", "psutil==7.2.2"]

[project.optional-dependencies]
paddle = ["paddlepaddle==3.3.1", "paddleocr==3.7.0", "paddlex==3.7.2"]

test = ["pytest==8.3.4", "httpx==0.28.1", "psutil==7.2.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mapvector = ["algorithms/legacy_b2c/resources/*.json", "algorithms/legacy_b2c/source_manifest.json", "algorithms/legacy_editor/source_manifest.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
